name: Restore the JAX compile cache
description: >-
  Ajax's persistent JAX compile cache (src/ajax/_compile_cache.py) as the
  last push to main left it for this job, on the same host fingerprint.

# Every CI run used to compile every program cold: on a quiet Mac a warm
# cache cut a pins + loop + PPO subset from 133 s to 74 s (CPU time 352 s
# to 85 s). The saving holds for the programs a change leaves alone; a
# change to code every agent traces (the loop, the evaluation) recompiles
# most of them.
#
# The key holds the job (and shard), whose programs differ, and the
# fingerprint subdirectory Ajax keys its entries by (CPU model and flags,
# Python, JAX and jaxlib versions), so a runner on another CPU starts cold
# instead of restoring entries it cannot load. Only pushes to main save
# (see the jobs' save steps): a pull request's caches would serve only
# that pull request and evict main's from the repository's quota. JAX
# bounds the directory (least recently used entries first), so restored
# caches do not grow without end.
inputs:
  job:
    description: The job and shard whose programs the cache holds.
    required: true
outputs:
  key:
    description: The key to save the cache under at the end of the job.
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        fingerprint=$(uv run python -c "from ajax._compile_cache import cache_dir_for, host_fingerprint; print(cache_dir_for('', host_fingerprint()))")
        echo "prefix=jax-${{ inputs.job }}-$fingerprint-" >> "$GITHUB_OUTPUT"
        echo "key=jax-${{ inputs.job }}-$fingerprint-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
        echo "JAX_COMPILATION_CACHE_MAX_SIZE=500000000" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ajax/jax_compile_cache
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
