name: Set up Python and uv
description: >-
  Python (3.12 by default), uv, and the project installed with its locked
  dependencies, or as the sync input resolves them.

# The CPU runners install no CUDA: it is the optional `cuda` extra. No
# virtualenv cache: it was ruled out when the environment held the CUDA
# wheels (about 2.5 GB compressed); whether one pays without them is not
# measured. The uv cache is kept but pruned before saving (prune-cache),
# which drops every wheel downloaded pre-built: only what uv built itself
# (the two git dependencies) is stored.
inputs:
  python-version:
    description: The Python version.
    default: "3.12"
  sync:
    description: >-
      The uv sync command. The compatibility jobs resolve without the lock,
      at the newest or the lowest versions pyproject.toml allows.
    default: uv sync --locked
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # setup-uv publishes no major tags since v8: pin the release.
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.11.28"
        enable-cache: true
        prune-cache: true

    - name: Install dependencies and the project
      shell: bash
      run: ${{ inputs.sync }}
