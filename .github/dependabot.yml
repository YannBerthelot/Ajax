# Monthly pull requests that refresh uv.lock (CONTRIBUTING.md, Dependencies
# and releases). pyproject.toml's ranges stay as written: they change by hand.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      # Released together and often coupled: one pull request.
      jax-stack:
        patterns:
          - "jax*"
          - flax
          - optax
          - chex
          - distrax
          - flashbax
          - orbax*
          - brax
          - mujoco*
          - playground
          # mujoco-mjx imports warp whenever it is installed, so a new mujoco
          # can need a new warp-lang.
          - warp-lang
          - gymnax
          # distrax depends on the nightly build of TensorFlow Probability.
          - tfp-nightly
      others:
        patterns:
          - "*"
