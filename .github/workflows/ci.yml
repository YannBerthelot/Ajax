name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run it supersedes (one group per
# pull request number). Every push to main gets its own group (run_id), so no
# main run is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The same CPU isolation as the Makefile's CPU_ENV.
env:
  CUDA_VISIBLE_DEVICES: ""
  JAX_PLATFORMS: cpu
  JAX_PLATFORM_NAME: cpu

jobs:
  lint:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Restore the pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files

  # The tests not marked slow, under coverage, split across three runners.
  # Shards 1 and 2 name directories; shard 3 runs everything else under
  # tests/ (pyproject's testpaths), so a new test file always runs somewhere.
  # The split balances the per-file times of the CI runs at a1658d9.
  # Probing (tests/probing) and conformance (tests/conformance) are left out
  # here and in the slow job: their own jobs run them.
  tests:
    name: Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_1: tests/agents/TDMPC2 tests/environments
      SHARD_2: tests/agents/DreamerV3 tests/extensions tests/agents/PPO tests/world_models
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: jax-cache
        uses: ./.github/actions/compile-cache
        with:
          job: tests-${{ matrix.shard }}
      # XLA's optimisation level 0 (the Makefile's FAST_XLA): these tests
      # check logic on tiny programs, so compiling fast matters more than
      # the code it makes (about 30% off a cold shard, measured by the
      # Compile preview); the probing and slow jobs keep the default level.
      - name: Run the shard under coverage
        env:
          XLA_FLAGS: --xla_backend_optimization_level=0 --xla_llvm_disable_expensive_passes=true
        run: |
          case "${{ matrix.shard }}" in
            1) paths="$SHARD_1" ;;
            2) paths="$SHARD_2" ;;
            3) paths="tests $(printf -- '--ignore=%s ' $SHARD_1 $SHARD_2)" ;;
          esac
          uv run coverage run -m pytest $paths -m "not slow" \
            --ignore=tests/probing --ignore=tests/conformance --durations=30
      # The cache only saves time: a failed save must not fail the job (in
      # the test shards it would also skip the coverage upload).
      - name: Save the JAX compile cache
        if: always() && github.event_name == 'push' && steps.jax-cache.outputs.key
        continue-on-error: true
        uses: ./.github/actions/compile-cache-save
        with:
          key: ${{ steps.jax-cache.outputs.key }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: |
          uv run coverage combine
          uv run coverage report --fail-under=70

  # Long trainings, run without coverage so its tracing overhead does not
  # lengthen them.
  slow:
    name: Slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: jax-cache
        uses: ./.github/actions/compile-cache
        with:
          job: slow
      - run: uv run pytest -m slow --ignore=tests/probing --ignore=tests/conformance --durations=30
      - name: Save the JAX compile cache
        if: always() && github.event_name == 'push' && steps.jax-cache.outputs.key
        continue-on-error: true
        uses: ./.github/actions/compile-cache-save
        with:
          key: ${{ steps.jax-cache.outputs.key }}

  # The agent-level learning checks, in their own job so adding probes does
  # not lengthen the other jobs, split across runners by the per-node times
  # of a full local run (each shard about 400 s there). Shards 1-3 run the
  # memory probes by memory kind, 2 and 3 with named files; shard 4 names
  # files; shard 5 runs everything else (and any new probe file), plus the
  # memory probes' tests that name no memory kind.
  probing:
    name: Probing (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      MEMORY: tests/probing/test_memory.py
      SHARD_2: tests/probing/test_world_models.py
      SHARD_3: tests/probing/test_bookkeeping.py
      SHARD_4: tests/probing/test_episode_ends.py tests/probing/test_extensions.py
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: jax-cache
        uses: ./.github/actions/compile-cache
        with:
          job: probing-${{ matrix.shard }}
      - name: Run the shard
        run: |
          run() { uv run pytest "$@" -v --durations=30; }
          case "${{ matrix.shard }}" in
            1) run $MEMORY -k gru ;;
            2) run $MEMORY -k mamba && run $SHARD_2 ;;
            3) run $MEMORY -k "lstm or transformer" && run $SHARD_3 ;;
            4) run $SHARD_4 ;;
            5) run tests/probing \
                 $(printf -- '--ignore=%s ' $MEMORY $SHARD_2 $SHARD_3 $SHARD_4) \
               && run $MEMORY -k "not gru and not mamba and not lstm and not transformer" ;;
          esac
      - name: Save the JAX compile cache
        if: always() && github.event_name == 'push' && steps.jax-cache.outputs.key
        continue-on-error: true
        uses: ./.github/actions/compile-cache-save
        with:
          key: ${{ steps.jax-cache.outputs.key }}

  # One training step of each agent against its original implementation, from
  # the same state with the same random numbers (tests/conformance), in its own
  # job, without coverage.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: jax-cache
        uses: ./.github/actions/compile-cache
        with:
          job: conformance
      - run: uv run pytest tests/conformance -v --durations=30
      - name: Save the JAX compile cache
        if: always() && github.event_name == 'push' && steps.jax-cache.outputs.key
        continue-on-error: true
        uses: ./.github/actions/compile-cache-save
        with:
          key: ${{ steps.jax-cache.outputs.key }}

  # The documentation site, built strictly: a page missing from the nav, a
  # broken link or a docstring that names a parameter the signature no longer
  # has fails here. mkdocstrings reads the source without importing it, so
  # the job installs the docs group alone, not the runtime's dependencies.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.28"
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --only-group docs
      - run: uv run --no-sync mkdocs build --strict

  # The one check branch protection requires: it passes only when every job
  # above passed.
  gate:
    name: Lint and Test
    if: always()
    needs: [lint, tests, coverage, slow, probing, conformance, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo 'lint=${{ needs.lint.result }} tests=${{ needs.tests.result }} coverage=${{ needs.coverage.result }} slow=${{ needs.slow.result }} probing=${{ needs.probing.result }} conformance=${{ needs.conformance.result }} docs=${{ needs.docs.result }}'
          test '${{ needs.lint.result }}' = success
          test '${{ needs.tests.result }}' = success
          test '${{ needs.coverage.result }}' = success
          test '${{ needs.slow.result }}' = success
          test '${{ needs.probing.result }}' = success
          test '${{ needs.conformance.result }}' = success
          test '${{ needs.docs.result }}' = success
