name: Compatibility

# pyproject.toml declares floors and caps only after a known break
# (CONTRIBUTING.md, Dependencies and releases); these jobs check that the
# declared ranges hold beyond uv.lock, which CI otherwise uses. newest: the
# latest versions allowed, on the newest Python supported. lowest: every
# direct dependency at its floor, on the oldest Python supported.
on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/compat.yml
      - .github/actions/setup/action.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  JAX_PLATFORMS: cpu
  JAX_PLATFORM_NAME: cpu

jobs:
  compat:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest
            python: "3.14"
            sync: uv sync --upgrade
          - name: lowest
            python: "3.12"
            sync: uv sync --resolution lowest-direct
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          sync: ${{ matrix.sync }}
      - run: uv pip list
      # The tests not marked slow, without the probes (the CI job's set). The
      # exact-output pins are left out: they detect change against the
      # locked versions, and other versions move them by rounding.
      - run: >-
          uv run --no-sync pytest tests -m "not slow" --ignore=tests/probing
          --ignore=tests/agents/test_agent_pins.py
          --ignore=tests/agents/SAC/test_sac_parity.py
          --ignore=tests/extensions/test_sac_extensions_equivalence.py
          --durations=30
