name: Compatibility

# pyproject.toml declares floors and caps only after a known break
# (CONTRIBUTING.md, Dependencies and releases); these jobs check that the
# declared ranges hold beyond uv.lock, which CI otherwise uses. newest: the
# latest versions allowed, on the newest Python supported. lowest: every
# direct dependency at its floor, on the oldest Python supported.
# The Release workflow also calls it on the commit to tag: a release needs
# the declared ranges green (owner 2026-11-26).
on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to run on.
        type: string
        required: true
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/compat.yml
      - .github/actions/setup/action.yml

# Read-only by default; a job that needs more says so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  JAX_PLATFORMS: cpu
  JAX_PLATFORM_NAME: cpu

jobs:
  # Split across four runners by file, as CI's test shards are (from the
  # recorded times, tests/.file_durations). In one job per version set, the
  # newest took 1 h 10-1 h 17 and the lowest's runner died at 1.5-2 h every
  # week from 2026-11-16 ("lost communication with the server", then a
  # shutdown signal at 81% on 2026-11-26): four JAX workers running ~1,200
  # tests each starved a 16 GB runner. A shard's workers run a quarter of
  # that, and the lowest runs three workers, not one per vCPU.
  compat:
    name: Compatibility (${{ matrix.name }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: [newest, lowest]
        shard: [1, 2, 3, 4]
        include:
          - name: newest
            python: "3.14"
            resolution: highest
            sync: uv sync --upgrade
            workers: auto
          - name: lowest
            python: "3.12"
            resolution: lowest-direct
            sync: uv sync
            workers: 3
    # Every uv command of the job resolves in the same mode, the tests' own
    # `uv run --locked` included: uv.lock records the mode it was resolved
    # in, and a lock from another mode is out of date to `--locked`.
    env:
      UV_RESOLUTION: ${{ matrix.resolution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          sync: ${{ matrix.sync }}
      - run: uv pip list
      # The tests not marked slow, without the probes and the conformance
      # checks (the CI test shards' set). Conformance runs each original in
      # its own locked environment, which this job's resolution mode would
      # put out of date to `--locked`; CI's Conformance job runs it. The
      # exact-output pins are left out: they detect change against the
      # locked versions, and other versions move them by rounding.
      # XLA's optimisation level 0, as in CI's test shards: in one process
      # at the default level this step took about 2 h 30 min.
      - env:
          XLA_FLAGS: --xla_backend_optimization_level=0 --xla_llvm_disable_expensive_passes=true
        run: >-
          uv run --no-sync pytest tests -m "not slow"
          --shard ${{ matrix.shard }}/4 --shard-by file -n ${{ matrix.workers }}
          --ignore=tests/probing
          --ignore=tests/conformance
          --ignore=tests/agents/test_agent_pins.py
          --ignore=tests/agents/SAC/test_sac_parity.py
          --ignore=tests/extensions/test_sac_extensions_equivalence.py
          --durations=30

  # The core install alone, without extras or groups: a gymnax agent trains,
  # so the core list holds every package the gymnax path imports. pytest is
  # the only addition.
  core:
    name: Compatibility (core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
          sync: uv sync --locked --no-default-groups
      - run: uv pip list
      - run: uv run --no-sync --with pytest pytest tests/test_core_install.py
