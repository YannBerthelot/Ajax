name: Compatibility

# pyproject.toml declares floors and caps only after a known break
# (CONTRIBUTING.md, Dependencies and releases); these jobs check that the
# declared ranges hold beyond uv.lock, which CI otherwise uses. newest: the
# latest versions allowed, on the newest Python supported. lowest: every
# direct dependency at its floor, on the oldest Python supported.
on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/compat.yml
      - .github/actions/setup/action.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  JAX_PLATFORMS: cpu
  JAX_PLATFORM_NAME: cpu

jobs:
  compat:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest
            python: "3.14"
            resolution: highest
            sync: uv sync --upgrade
          - name: lowest
            python: "3.12"
            resolution: lowest-direct
            sync: uv sync
    # Every uv command of the job resolves in the same mode, the tests' own
    # `uv run --locked` included: uv.lock records the mode it was resolved
    # in, and a lock from another mode is out of date to `--locked`.
    env:
      UV_RESOLUTION: ${{ matrix.resolution }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          sync: ${{ matrix.sync }}
      - run: uv pip list
      # The tests not marked slow, without the probes and the conformance
      # checks (the CI test shards' set). Conformance runs each original in
      # its own locked environment, which this job's resolution mode would
      # put out of date to `--locked`; CI's Conformance job runs it. The
      # exact-output pins are left out: they detect change against the
      # locked versions, and other versions move them by rounding.
      - run: >-
          uv run --no-sync pytest tests -m "not slow" --ignore=tests/probing
          --ignore=tests/conformance
          --ignore=tests/agents/test_agent_pins.py
          --ignore=tests/agents/SAC/test_sac_parity.py
          --ignore=tests/extensions/test_sac_extensions_equivalence.py
          --durations=30

  # The core install alone, without extras or groups: a gymnax agent trains,
  # so the core list holds every package the gymnax path imports. pytest is
  # the only addition.
  core:
    name: Compatibility (core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
          sync: uv sync --locked --no-default-groups
      - run: uv pip list
      - run: uv run --no-sync --with pytest pytest tests/test_core_install.py
