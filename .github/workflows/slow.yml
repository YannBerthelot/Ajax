name: Slow tier

# The two-tier test plan's slow tier: everything that trains (tests/probing,
# marked slow by tests/conftest.py, and the tests marked slow elsewhere),
# in six shards by recorded duration (tests/.durations), on x86, the
# platform most users train on. A probe case's tests stay together, on one
# shard and one of its two xdist workers (--shard-by group, --dist
# loadgroup): they read one cached training, which split they trained
# again (1,075 s of 6,726 s of probes on 2026-11-26). Two workers on the
# four cores ran a probe sample 40% faster than one, and four no faster
# than two (bob, 2026-11-26). It runs daily on main when main changed, by
# hand on any branch, once per `run-slow-tier` label added to a pull
# request, and from the Release workflow on the commit to tag. On main, a
# red run opens an issue (or comments on the open one) and bisects when the
# range is short; a green run closes it (.github/scripts/slow_report.py).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to run on.
        type: string
        required: true
  pull_request:
    types: [labeled]

# Read-only by default (actions: read lists earlier slow runs); the report
# jobs ask for issues and pull requests themselves.
permissions:
  contents: read
  actions: read

# Per pull request and label: adding another label starts a run that skips,
# and must not cancel a slow run in progress.
concurrency:
  group: slow-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  JAX_PLATFORMS: cpu
  JAX_PLATFORM_NAME: cpu

jobs:
  # A daily run is skipped when the last daily or by-hand run on main whose
  # shards ran tested main's head: a red one already has its issue. Runs
  # count by their shard jobs (.github/scripts/slow_runs.py): a run whose
  # shards were skipped concludes success but tested nothing.
  changed:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-slow-tier'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      sha: ${{ steps.check.outputs.sha }}
      last_green: ${{ steps.check.outputs.last_green }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          # An assignment, so that a failure of the script fails the step.
          history=$(python3 .github/scripts/slow_runs.py history)
          eval "$history"  # sets last and last_green
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "last_green=$last_green" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = schedule ] && [ "$last" = "$SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: an earlier run on main tested $SHA, so this run tested nothing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  slow:
    name: Slow (shard ${{ matrix.shard }})
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    # actions: write lets compile-cache-save delete this job's older caches.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.changed.outputs.sha }}
      - uses: ./.github/actions/setup
      - id: jax-cache
        uses: ./.github/actions/compile-cache
        with:
          job: slow-tier-${{ matrix.shard }}
      - run: >-
          uv run pytest -m slow --shard ${{ matrix.shard }}/6 --shard-by group
          -n 2 --dist loadgroup -v --durations=30
          --junitxml=junit-${{ matrix.shard }}.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
      - name: Save the JAX compile cache
        if: always() && github.event_name == 'schedule' && steps.jax-cache.outputs.key
        continue-on-error: true
        uses: ./.github/actions/compile-cache-save
        with:
          key: ${{ steps.jax-cache.outputs.key }}

  report:
    needs: [changed, slow]
    if: >-
      always() && needs.changed.outputs.run == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      issue: ${{ steps.report.outputs.issue }}
      bisect: ${{ steps.report.outputs.bisect }}
      nodes: ${{ steps.report.outputs.nodes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.changed.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
      - id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.slow.result }}
          SHA: ${{ needs.changed.outputs.sha }}
          LAST_GREEN: ${{ needs.changed.outputs.last_green }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/scripts/slow_report.py junit
          --result "$RESULT" --sha "$SHA" --last-green "$LAST_GREEN" --run-url "$RUN_URL"

  bisect:
    needs: [changed, report]
    if: always() && needs.report.outputs.bisect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.changed.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: bisect
        env:
          LAST_GREEN: ${{ needs.changed.outputs.last_green }}
          NODES: ${{ needs.report.outputs.nodes }}
        # $NODES unquoted: one argument per test node.
        run: .github/scripts/slow_bisect.sh "$LAST_GREEN" $NODES
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.bisect.outputs.result }}
          ISSUE: ${{ needs.report.outputs.issue }}
        run: |
          if [ "$RESULT" = flaky ]; then
            note="The failing tests pass when re-run at the head: flaky, no bisect."
          else
            pr=$(gh pr list --state merged --search "$RESULT" --json number -q '.[0].number // empty')
            note="Bisect over the merges since the last green run: first bad commit $RESULT${pr:+ (#$pr)}."
          fi
          gh issue comment "$ISSUE" --body "$note"
