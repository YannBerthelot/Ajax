repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        name: Ruff lint and import sort
        language_version: python3.12
      - id: ruff-format
        name: Ruff formatter
        language_version: python3.12

  # mypy runs in the project's environment, so it checks against jax, flax
  # and the other dependencies at their locked versions, and its own version
  # is the locked one.
  - repo: local
    hooks:
      - id: mypy
        name: Mypy type checker
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        # benchmarks/ holds throwaway benchmark scripts (kwargs-dict
        # unpacking into typed constructors etc.) -- not library code, so
        # not gated on strict typing. ruff still lints them.
        exclude: "^benchmarks/"
        args:
          - "--config-file=pyproject.toml"
          - "--python-version=3.12"
