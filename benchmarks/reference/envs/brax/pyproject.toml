# Brax's trainers (PPO, APG), pinned for the reference comparisons
# (../../README.md). brax, mujoco and jax are at the versions of Ajax's
# uv.lock, so both sides step the same environments; gymnax serves the APG
# comparison, which runs Brax's trainer on gymnax's Pendulum.
[project]
name = "refcmp-brax"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "brax==0.14.2",
    "mujoco==3.7.0",
    "mujoco-mjx==3.7.0",
    "jax==0.7.2",
    "gymnax",
]

[tool.uv]
package = false

[tool.uv.sources]
gymnax = { git = "https://github.com/YannBerthelot/gymnax.git", rev = "61ff068971a6f639d33ff01c96df6d3b4600439e" }
