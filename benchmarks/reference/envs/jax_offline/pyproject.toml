# The JAX offline originals' conformance checks (tests/conformance): ReBRAC
# (tinkoff-ai/ReBRAC@694385b, vendored) and Cal-QL (nakamotoo/Cal-QL@ac6eafe, JaxCQL;
# no license, so it is recorded from a local clone and only its records are committed).
# ReBRAC pins flax 0.6.1, optax 0.1.3, chex 0.1.5 and numpy 1.23.1 and leaves jax
# unpinned; Cal-QL pins jax 0.3.15, flax 0.4.2, optax 0.1.3, chex 0.1.5 and distrax
# 0.1.2. PyPI keeps jaxlib only from 0.4.18, and those flax, optax and chex versions
# import names jax had removed by then (ShapedArray, ShardedDeviceArray, DeviceArray), so
# these are the oldest that run on it: flax 0.7.4 and optax 0.1.7, as the CrossQ env has,
# and chex 0.1.7. The parts the updates use (Dense, LayerNorm, vmap, Adam,
# incremental_update, distrax's tanh Gaussian) compute the same. gym and tqdm are what
# ReBRAC's src/utils/common.py imports with Metrics, ml-collections and absl-py what
# JaxCQL's config reads; the recorders' data come from gymnasium (gym 0.23's
# classic-control tasks import pygame).
[project]
name = "conformance-jax-offline"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "jax==0.4.18",
    "jaxlib==0.4.18",
    "flax==0.7.4",
    "optax==0.1.7",
    "chex==0.1.7",
    "distrax==0.1.2",
    "tensorflow-probability==0.21.0",
    "numpy==1.23.1",
    "scipy==1.11.4",
    "gym==0.23.1",
    "tqdm==4.64.0",
    "gymnasium==0.29.1",
    "ml-collections==0.1.1",
    "absl-py==1.3.0",
]

[tool.uv]
package = false
