# purejaxql's PQN (../../vendor/purejaxql), pinned for the reference
# comparisons (../../README.md): the libraries its pqn_gymnax.py imports, at
# the versions of Ajax's uv.lock, under which it was checked to run.
[project]
name = "refcmp-purejaxql"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "jax==0.7.2",
    "flax==0.10.7",
    "optax==0.2.6",
    "chex==0.1.91",
    "gymnax==1.0.1",
]

[tool.uv]
package = false
