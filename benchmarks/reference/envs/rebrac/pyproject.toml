# The ReBRAC original's conformance check (tests/conformance). tinkoff-ai/ReBRAC@694385b
# pins flax 0.6.1, optax 0.1.3, chex 0.1.5 and numpy 1.23.1 and leaves jax unpinned (a
# CUDA build of 2023). PyPI keeps jaxlib only from 0.4.18, and those three pins import
# names that jax had removed by then (ShapedArray, ShardedDeviceArray, DeviceArray), so
# flax, optax and chex are the oldest that run on it: flax 0.7.4 and optax 0.1.7, as the
# CrossQ env has, and chex 0.1.7. The parts the update uses (Dense, LayerNorm, vmap,
# Adam, incremental_update) compute the same in both versions. gym and tqdm are what
# src/utils/common.py imports with Metrics; the recorder's data come from gymnasium (gym
# 0.23's classic-control tasks import pygame).
[project]
name = "conformance-rebrac"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "jax==0.4.18",
    "jaxlib==0.4.18",
    "flax==0.7.4",
    "optax==0.1.7",
    "chex==0.1.7",
    "distrax==0.1.2",
    "tensorflow-probability==0.21.0",
    "numpy==1.23.1",
    "scipy==1.11.4",
    "gym==0.23.1",
    "tqdm==4.64.0",
    "gymnasium==0.29.1",
]

[tool.uv]
package = false
