# Spinning Up's VPG (vendor/openai_spinningup), pinned for the REINFORCE
# reference comparison (../../README.md), with CPU-only torch wheels. Spinning
# Up pinned no torch beyond >=1.3; vpg.py and core.py use only torch's stable
# API (nn, Normal, Categorical, Adam). jax and gymnax at the versions the SB3
# env pins, so both sides step the same environment code.
[project]
name = "refcmp-spinup"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.13.0",
    "numpy",
    "scipy",
    "jax==0.7.2",
    "gymnax==1.0.1",
    "gymnasium==1.1.1",
    # gymnax imports it (gymnax/utils/load_mnist.py) without declaring it.
    "six",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
