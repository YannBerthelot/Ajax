# CleanRL's single-file scripts (../../vendor/cleanrl) for the speed
# comparison (../../README.md). The scripts are written for Gymnasium 0.29's
# vector API, so Gymnasium stays there (HalfCheetah-v4, the same model as
# v5); torch and JAX are at the versions the other libraries here run,
# Stable-Baselines3 at ../sb3's (its ReplayBuffer serves the off-policy
# scripts).
[project]
name = "speed-cleanrl"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "gymnasium[mujoco]==0.29.1",
    "mujoco==3.15.0",
    "stable-baselines3==2.9.2",
    "torch==2.15.0",
    "jax==0.11.2",
    "flax==0.12.12",
    "optax==0.2.9",
    "tyro==1.0.17",
    "tensorboard==2.21.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
