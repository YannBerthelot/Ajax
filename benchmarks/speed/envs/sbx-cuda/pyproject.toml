# SBX on a GPU for the speed comparison (../../README.md): ../sbx with JAX's
# and torch's CUDA builds. Its own project, so the CPU records keep the lock
# they ran with.
[project]
name = "speed-sbx-cuda"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "sbx-rl==0.28.0",
    "stable-baselines3==2.9.2",
    "torch==2.15.0",
    "jax[cuda]==0.11.2",
    "gymnasium[mujoco]==1.4.0",
    "mujoco==3.15.0",
]

[tool.uv]
package = false
