site_name: Ajax
site_description: >-
  Reinforcement learning agents in JAX: whole training runs compiled end to
  end, research features composed as extensions.
site_url: https://yannberthelot.github.io/Ajax/
repo_url: https://github.com/YannBerthelot/Ajax
repo_name: YannBerthelot/Ajax
edit_uri: edit/main/docs/
copyright: Copyright &copy; Yann Berthelot

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The world-model design notes keep their parity fixture generators and the
# reference-comparison harness and results beside them; only their Markdown
# belongs on the site. The reference comparison's pages are records of runs,
# kept on GitHub: docs/hooks.py turns links to them into GitHub links. The
# hook is build code, not a page.
exclude_docs: |
  /hooks.py
  __pycache__/
  /world_models/**
  !/world_models/**/*.md
  /world_models/reference_comparison/**

# A page left out of the nav, or a link the build cannot resolve, fails
# `mkdocs build --strict` instead of shipping a site with a hole in it.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              # Types live in the signatures' annotations, not the docstrings.
              # A documented parameter missing from the signature still fails.
              warn_missing_types: false
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            # Agents document their hyperparameters on __init__.
            merge_init_into_class: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Why Ajax: getting-started/why-ajax.md
  - User guide:
      - Training an agent: guide/training.md
      - Environments: guide/environments.md
      - Networks and the PID policy: guide/networks.md
      - Memory: guide/memory.md
      - Logging: guide/logging.md
      - Checkpoints and resuming: guide/checkpoints.md
      - Performance: guide/performance.md
      - Comparing agents: guide/comparing-agents.md
      - Extensions: guide/extensions.md
      - Compatibility: guide/compatibility.md
      - Expert guidance: guide/expert-guidance.md
      - Differentiable simulation: guide/differentiable-simulation.md
      - World models: guide/world-models.md
  - Algorithms:
