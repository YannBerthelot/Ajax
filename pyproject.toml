[tool.poetry]
name = "Ajax"
version = "0.3.1"
description = "Agents in JAX: Jax based implementations of RL algorithms"
authors = ["Yann Berthelot <yannberthelot1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
gymnasium = "^1.2.0"
tqdm = "^4.65.0"
pandas = "^2.1.1"
matplotlib = "^3.8.0"
jax = [
  { version = ">=0.6.2", markers = "sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'aarch64')" },
  { version = ">=0.6.2", extras  = ["cuda"], markers = "sys_platform != 'darwin' or (platform_machine != 'arm64' and platform_machine != 'aarch64')" },
]
flax = "^0.10.7"
flashbax = "^0.1.3"
mujoco = "^3.1.4"
mujoco-mjx = "^3.1.4"
python-dotenv = "^1.1.1"
# gymnax 1.0 (six-value step API: obs, state, reward, terminated,
# truncated, info).
#
# TEMPORARY: this should be `gymnax = "^1.0.1"` from PyPI. gymnax 1.0.0
# caps jax at <0.7 and gymnasium at <1.2, which no resolver can satisfy
# next to distrax (jax>=0.7), so the release is unusable here. The branch below is upstream main with those
# two caps lifted and nothing else changed; it is proposed upstream as
# YannBerthelot:chore/relax-runtime-pins. Drop the fork and pin the PyPI
# release once that lands.
gymnax = {git = "https://github.com/YannBerthelot/gymnax.git", branch = "chore/relax-runtime-pins"}
distrax = ">=0.1.6"
tensorboardx = "^2.6.4"
dill = "^0.4.1"
statsmodels = "^0.14.6"
pyarrow = "^23.0.1"
playground = "^0.2.0"



[tool.poetry.group.dev.dependencies]
black = "23.3.0"
mypy = "^1.4.1"
pre-commit = "^3.3.3"
pytest = "7.4.0"
tox = "^4.6.4"
coverage = {extras = ["toml"], version = "^7.8.0"}
ruff = "^0.11.6"
# TEMPORARY: pinned to the gymnax 1.0 migration branch. The released
# 0.5.1 still requires `gymnax ^0.0.9`, which makes the whole graph
# unresolvable. Restore the PyPI pin once a migrated release is cut.
probing-environments = {git = "https://github.com/YannBerthelot/ProbingEnvironments.git", branch = "feature/gymnax-1.0-compat"}


[tool.poetry.group.render.dependencies]
imageio = {extras = ["ffmpeg"], version = "^2.37.0"}

[tool.poetry.group.wandb.dependencies]
wandb = "^0.19.9"



# The Plane3DCircle scenarios of benchmarks/perf_bench.py need target_gym;
# the framework does not. Opt in with `poetry install --with plane`.
[tool.poetry.group.plane]
optional = true

[tool.poetry.group.plane.dependencies]
target-gym = "^0.6.1"


[[tool.poetry.source]]
name = "pypi"
priority = "primary"


[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[tool.black]
line-length = 88
preview = true
verbose = false

[tool.ruff]
line-length = 88
fix = true
src = ["src", "tests"]

[tool.ruff.lint]
select =  ["I", "F", "E", "W", "B", "C", "RUF"]
ignore = ["E501", "RUF002", "RUF003"]
fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# ClassVar, implicit optional check not needed for tests
"./tests/*.py" = ["RUF012", "RUF013"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 20


[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
disable_error_code = ["attr-defined" ,"call-arg","misc"]
exclude = """(?x)(
    tests/test_logger.py$
    | tests/test_train_eval_mode.py$
  )"""



[tool.pytest.ini_options]
# ".*" restores pytest's default of skipping hidden dirs (overriding
# norecursedirs drops it), so worktrees under .claude/ are not collected.
norecursedirs = [".*", "tests/classical/*", "tests/recurrent/*"]
# A run without paths collects exactly what the CI shards cover together.
testpaths = ["tests"]
markers = [
    "slow: long trainings; CI runs them in their own job, without coverage (select with -m slow, deselect with -m \"not slow\")",
]

[tool.coverage.run]
branch = true
# The library only: not tests/, benchmarks/ or third-party code installed
# from a local path (probing_environments).
source = ["src/ajax"]
# The async logging worker (ajax.logging.wandb_logging) runs in a spawned
# subprocess: measure subprocesses too ("thread" keeps the default thread
# tracing). Every process writes its own data file, so run
# `coverage combine` before `coverage report`.
concurrency = ["thread", "multiprocessing"]
parallel = true


[tool.coverage.report]
ignore_errors = true
fail_under = 70

exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    ]

[build-system]
requires = ["poetry-core","poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend =  "poetry_dynamic_versioning.backend"
