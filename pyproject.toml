[project]
name = "Ajax"
version = "0.3.1"
description = "Agents in JAX: Jax based implementations of RL algorithms"
authors = [{ name = "Yann Berthelot", email = "yannberthelot1@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.0,<2",
    "tqdm>=4.65.0,<5",
    # Floors only: a cap is added after a known break, with its reason.
    # A capped flax (<0.11) next to an uncapped JAX once broke pip installs:
    # flax 0.10 calls a function JAX 0.11 removed. flax 0.12.8 needs JAX 0.10.
    "jax>=0.10.0",
    "flax>=0.12.8",
    # Imported directly, so declared, not left to the packages that pull
    # them in. brax is capped: create.py uses its private brax.envs._envs.
    "brax>=0.14.2,<0.15",
    "chex>=0.1.91,<0.2",
    "numpy>=2.1,<3",
    "optax>=0.2.6,<0.3",
    "flashbax>=0.1.3,<0.2",
    "mujoco>=3.1.4,<4",
    "mujoco-mjx>=3.1.4,<4",
    # gymnax 1.0 (six-value step API: obs, state, reward, terminated,
    # truncated, info). 1.0.1 is the first release without the jax<0.7 cap.
    "gymnax>=1.0.1,<2",
    # 0.1.7 calls jax.core.get_aval, which JAX 0.11 removed.
    "distrax>=0.1.9",
    "tensorboardx>=2.6.4,<3",
    "playground>=0.2.0,<0.3",
]

[project.optional-dependencies]
# CUDA (NVIDIA GPUs, Linux only): `uv sync --extra cuda`, or depend on
# `ajax[cuda]`. Without it JAX runs on the CPU.
cuda = ["jax[cuda]>=0.10.0; sys_platform == 'linux'"]
# ajax.compare.estimate's confidence sequence: `uv sync --extra compare`, or
# depend on `ajax[compare]`. From the commit in [tool.uv.sources].
compare = ["adastop"]
# ajax.reproduction.load, the reference comparisons' published data:
# `uv sync --extra reproduction`, or depend on `ajax[reproduction]`.
reproduction = ["huggingface-hub>=0.30,<2", "pandas>=2.2,<3", "pyarrow>=15"]

[project.urls]
Homepage = "https://github.com/YannBerthelot/Ajax"
Documentation = "https://yannberthelot.github.io/Ajax/"
Repository = "https://github.com/YannBerthelot/Ajax"
Issues = "https://github.com/YannBerthelot/Ajax/issues"

[dependency-groups]
dev = [
    "mypy>=1.4.1,<2",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.3.3,<4",
    "pytest==7.4.0",
    # Only the benchmarks/ and docs/ scripts plot.
    "matplotlib>=3.8.0,<4",
    # docs/world_models/reference_comparison/compare.py reads run configs.
    "PyYAML>=6.0",
    "coverage[toml]>=7.8.0,<8",
    "ruff>=0.11.6,<0.12",
    # From the branch in [tool.uv.sources].
    "probing-environments",
    # The compare extra, for its tests; from the commit in [tool.uv.sources].
    "adastop",
    # benchmarks/reference/refcmp_publish.py writes, and its tests read,
    # the reproduction extra's Parquet tables.
    "pandas>=2.2,<3",
    "pyarrow>=15",
]
wandb = ["wandb>=0.19.9,<0.20"]
# The Plane3DCircle scenario of benchmarks/perf_bench.py needs target_gym;
# the framework does not. Opt in with `uv sync --group plane`.
plane = ["target-gym>=0.6.1,<0.7"]
# The documentation site (mkdocs.yml). mkdocstrings reads the docstrings from
# the source without importing it, so the site builds without the runtime
# (`uv sync --only-group docs`). It formats the API signatures with ruff when
# ruff is installed, hence ruff here too, bounded as in dev.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26,<2",
    "pymdown-extensions>=10,<11",
    "ruff>=0.11.6,<0.12",
]

[tool.uv]
default-groups = ["dev", "wandb"]

[tool.uv.sources]
# TEMPORARY: pinned to the gymnax 1.0 migration branch. The released
# 0.5.1 still requires `gymnax ^0.0.9`, which makes the whole graph
# unresolvable. Restore the PyPI pin once a migrated release is cut.
probing-environments = { git = "https://github.com/YannBerthelot/ProbingEnvironments.git", branch = "feature/gymnax-1.0-compat" }
# TEMPORARY: this should be adastop from PyPI. Bounded_Confseq, the
# confidence sequence behind ajax.compare.estimate, is only in upstream main
# (added 2026-07-16); 0.1.3 predates it. Pin the first release that has it.
adastop = { git = "https://github.com/TimotheeMathieu/adastop.git", rev = "07e7159643f11467c154266b5ef3b1be6ca8ddd8" }

[tool.uv.build-backend]
# The distribution is "Ajax"; the import name is lower case.
module-name = "ajax"

[tool.ruff]
line-length = 88
# Third-party code kept verbatim (benchmarks/reference/vendor/*/README.md).
extend-exclude = ["benchmarks/reference/vendor"]
fix = true
src = ["src", "tests"]

[tool.ruff.lint]
select =  ["I", "F", "E", "W", "B", "C", "RUF", "ARG"]
ignore = ["E501", "RUF002", "RUF003"]
fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# ClassVar, implicit optional check not needed for tests
"./tests/*.py" = ["RUF012", "RUF013"]
# Test stubs, fixtures and monkeypatched callbacks mirror signatures they
# ignore: unused arguments there are noise.
"tests/**/*.py" = ["ARG"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 20


[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true



[tool.pytest.ini_options]
# ".*" restores pytest's default of skipping hidden dirs (overriding
# norecursedirs drops it), so worktrees under .claude/ are not collected.
norecursedirs = [".*"]
# A run without paths collects exactly what the CI shards cover together.
testpaths = ["tests"]
# The benchmark scripts the tests import: they run as scripts, and the
# world-model ones import each other as sibling modules.
pythonpath = ["benchmarks", "benchmarks/world_models", "benchmarks/reference"]
# An unregistered mark is an error, not a silent no-op.
addopts = "--strict-markers"
markers = [
    "slow: long trainings; CI runs them in their own job, without coverage (select with -m slow, deselect with -m \"not slow\")",
]

[tool.coverage.run]
branch = true
# The library only: not tests/, benchmarks/ or third-party code installed
# from a local path (probing_environments).
source = ["src/ajax"]
# The async logging worker (ajax.logging.wandb_logging) runs in a spawned
# subprocess: measure subprocesses too ("thread" keeps the default thread
# tracing). Every process writes its own data file, so run
# `coverage combine` before `coverage report`.
concurrency = ["thread", "multiprocessing"]
parallel = true


[tool.coverage.report]
ignore_errors = true
fail_under = 70

exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    ]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
