[project]
name = "Ajax"
version = "0.3.1"
description = "Agents in JAX: Jax based implementations of RL algorithms"
authors = [{ name = "Yann Berthelot", email = "yannberthelot1@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium>=1.2.0,<2",
    "tqdm>=4.65.0,<5",
    "pandas>=2.1.1,<3",
    "matplotlib>=3.8.0,<4",
    "jax>=0.6.2; sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'aarch64')",
    "jax[cuda]>=0.6.2; sys_platform != 'darwin' or (platform_machine != 'arm64' and platform_machine != 'aarch64')",
    "flax>=0.10.7,<0.11",
    "flashbax>=0.1.3,<0.2",
    "mujoco>=3.1.4,<4",
    "mujoco-mjx>=3.1.4,<4",
    "python-dotenv>=1.1.1,<2",
    # gymnax 1.0 (six-value step API: obs, state, reward, terminated,
    # truncated, info), from the fork in [tool.uv.sources].
    "gymnax",
    "distrax>=0.1.6",
    "tensorboardx>=2.6.4,<3",
    "dill>=0.4.1,<0.5",
    "statsmodels>=0.14.6,<0.15",
    "pyarrow>=23.0.1,<24",
    "playground>=0.2.0,<0.3",
]

[dependency-groups]
dev = [
    "black==23.3.0",
    "mypy>=1.4.1,<2",
    "pre-commit>=3.3.3,<4",
    "pytest==7.4.0",
    "tox>=4.6.4,<5",
    "coverage[toml]>=7.8.0,<8",
    "ruff>=0.11.6,<0.12",
    # From the branch in [tool.uv.sources].
    "probing-environments",
]
render = ["imageio[ffmpeg]>=2.37.0,<3"]
wandb = ["wandb>=0.19.9,<0.20"]
# The Plane3DCircle scenarios of benchmarks/perf_bench.py need target_gym;
# the framework does not. Opt in with `uv sync --group plane`.
plane = ["target-gym>=0.6.1,<0.7"]

[tool.uv]
default-groups = ["dev", "render", "wandb"]

[tool.uv.sources]
# TEMPORARY: this should be `gymnax>=1.0.1,<2` from PyPI. gymnax 1.0.0
# caps jax at <0.7 and gymnasium at <1.2, which no resolver can satisfy
# next to distrax (jax>=0.7), so the release is unusable here. The branch below is upstream main with those
# two caps lifted and nothing else changed; it is proposed upstream as
# YannBerthelot:chore/relax-runtime-pins. Drop the fork and pin the PyPI
# release once that lands.
gymnax = { git = "https://github.com/YannBerthelot/gymnax.git", branch = "chore/relax-runtime-pins" }
# TEMPORARY: pinned to the gymnax 1.0 migration branch. The released
# 0.5.1 still requires `gymnax ^0.0.9`, which makes the whole graph
# unresolvable. Restore the PyPI pin once a migrated release is cut.
probing-environments = { git = "https://github.com/YannBerthelot/ProbingEnvironments.git", branch = "feature/gymnax-1.0-compat" }

[tool.uv.build-backend]
# The distribution is "Ajax"; the import name is lower case.
module-name = "ajax"

[tool.black]
line-length = 88
preview = true
verbose = false

[tool.ruff]
line-length = 88
fix = true
src = ["src", "tests"]
# Deliberate workaround: ruff takes its target from requires-python (py311)
# once [project] exists. Under Poetry there was none and ruff used its
# default, py38. py311 rewrites 61 files (zip(strict=False) from B905, new
# formatting), which belongs in its own change, not in the switch to uv.
target-version = "py38"

[tool.ruff.lint]
select =  ["I", "F", "E", "W", "B", "C", "RUF", "ARG"]
ignore = ["E501", "RUF002", "RUF003"]
fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# ClassVar, implicit optional check not needed for tests
"./tests/*.py" = ["RUF012", "RUF013"]
# Test stubs, fixtures and monkeypatched callbacks mirror signatures they
# ignore: unused arguments there are noise.
"tests/**/*.py" = ["ARG"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 20


[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
disable_error_code = ["attr-defined" ,"call-arg","misc"]
exclude = """(?x)(
    tests/test_logger.py$
    | tests/test_train_eval_mode.py$
  )"""



[tool.pytest.ini_options]
# ".*" restores pytest's default of skipping hidden dirs (overriding
# norecursedirs drops it), so worktrees under .claude/ are not collected.
norecursedirs = [".*", "tests/classical/*", "tests/recurrent/*"]
# A run without paths collects exactly what the CI shards cover together.
testpaths = ["tests"]
markers = [
    "slow: long trainings; CI runs them in their own job, without coverage (select with -m slow, deselect with -m \"not slow\")",
]

[tool.coverage.run]
branch = true
# The library only: not tests/, benchmarks/ or third-party code installed
# from a local path (probing_environments).
source = ["src/ajax"]
# The async logging worker (ajax.logging.wandb_logging) runs in a spawned
# subprocess: measure subprocesses too ("thread" keeps the default thread
# tracing). Every process writes its own data file, so run
# `coverage combine` before `coverage report`.
concurrency = ["thread", "multiprocessing"]
parallel = true


[tool.coverage.report]
ignore_errors = true
fail_under = 70

exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    ]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
